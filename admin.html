<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator | Weda.lk Research</title><meta name="description" content="Secure administration for approved Weda.lk research files."><meta name="robots" content="noindex,nofollow"><link rel="icon" href="./assets/icons/favicon.svg"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/enhancements.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="./js/config.js" defer></script><script src="./js/backend.js" defer></script><script src="./js/admin.js" defer></script></head><body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><nav class="container nav-wrap"><a class="brand" href="./index.html"><span class="brand-mark">W</span>Weda.lk</a><a class="button button-secondary" href="./index.html">Back to site</a></nav></header><main id="main"><section class="page-hero"><div class="container"><span class="eyebrow">Restricted area</span><h1>Research library administration</h1><p>Sign in with an approved administrator account to upload and manage public research assets.</p></div></section><section class="section"><div class="container grid grid-2"><form class="card form-stack" data-login-form><h2>Administrator sign in</h2><div class="field"><label for="admin-email">Email</label><input id="admin-email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div class="field"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required minlength="8"></div><button class="button" type="submit">Sign in</button><div data-admin-message class="notice notice-warning" hidden></div></form><section class="card" data-admin-panel hidden><div class="section-head"><div><span class="eyebrow">Authenticated</span><h2>Upload approved file</h2></div><button class="button button-secondary" data-sign-out>Sign out</button></div><form class="form-stack" data-upload-form><div class="field"><label for="asset-kind">Library</label><select id="asset-kind" name="kind" required><option value="documents">Documents</option><option value="presentations">Presentations</option></select></div><div class="field"><label for="asset-title">Title</label><input id="asset-title" name="title" required maxlength="160"></div><div class="field"><label for="asset-description">Description</label><textarea id="asset-description" name="description" required maxlength="800"></textarea></div><div class="field"><label for="asset-category">Category</label><input id="asset-category" name="category" required maxlength="80"></div><div class="field"><label for="asset-component">Component (optional)</label><select id="asset-component" name="component"><option value="">Not applicable</option><option>C1</option><option>C2</option><option>C3</option><option>C4</option></select></div><div class="field"><label for="asset-version">Version</label><input id="asset-version" name="version" maxlength="30"></div><div class="field"><label for="asset-file">File</label><input id="asset-file" name="file" type="file" accept=".pdf,.ppt,.pptx,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" required></div><label><input name="is_public" type="checkbox"> Publish immediately (approved assets only)</label><button class="button" type="submit">Upload file</button><progress data-upload-progress max="100" value="0" hidden></progress><div data-upload-message class="notice notice-warning" hidden></div></form><hr class="admin-divider"><div class="section-head"><div><span class="eyebrow">Library</span><h2>Manage uploaded files</h2></div><button class="button button-secondary" type="button" data-refresh-items>Refresh</button></div><div data-admin-items class="admin-items"><p>Loading files…</p></div></section></div></section></main></body></html>
